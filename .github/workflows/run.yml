name: run

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check.py
      - run: python run.py
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/
            data/prices.csv
